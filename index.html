
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="短押し・２回押し・長押しで遊べる、光美容器のシミュレーター。">
  <title>つるるん！ 光美容器シミュレーター</title>
  <link rel="stylesheet" href="style.css">
</head>

<body data-state="off">
  <div class="magazine">
    <div class="facing-page" aria-hidden="true">
      <span>24</span>
    </div>

    <main>
      <header>
        <span class="cover-name">
          暮らしの道具帖
          <span class="issue">週刊・冬の特別号</span>
        </span>
        <span>ひよりスタジオ</span>
      </header>

      <div class="layout">
        <section aria-labelledby="title">
          <div class="kicker">冬のおすすめ美容アイテム</div>

          <h1 id="title">つるるん<span>！</span></h1>

          <p class="cover-line">
            <span>この冬、<em>毛穴レス</em>な印象へ。</span>
            <span>透けるようなツヤ肌。</span>
          </p>

          <div class="cover-tags">
            <span>＋かわいい</span>
            <span>＋好印象</span>
          </div>

          <h2>おうち美容 ｜ 光美容器シミュレーター</h2>
        </section>

        <div class="interaction">
          <div class="readout" aria-live="polite">
            <div class="label">
              いまの状態 / <span id="mode">おやすみ中</span>
            </div>
            <strong id="state">電源オフ</strong>
            <p id="hint">
              電源ボタンを１回押すと、弱モードでスタート！
            </p>
          </div>

          <ol aria-label="使い方">
            <li><span>01</span>１回押しで弱</li>
            <li><span>02</span>２回押しで強</li>
            <li><span>03</span>長押しでオフ</li>
          </ol>
        </div>

        <figure aria-label="横顔のラインアートと光美容器">

          <div class="cover-note">
            冬のおうち美容
            <strong>01</strong>
          </div>

          <!-- Decorative illustrations -->
          <svg class="desserts"
               viewBox="0 0 640 520"
               fill="none"
               aria-hidden="true">
            <g stroke="currentColor"
               stroke-width="1.6"
               stroke-linecap="round"
               stroke-linejoin="round">

              <!-- Strawberry shortcake -->
              <path d="M45 400l47-21 38 22-48 17z
                       M45 400v24l37 19 48-17v-25
                       M82 418v25

              <path d="M76 389c-8-9 0-17 6-13

                       M82 375l-3-7m3 7 6-6"/>

              <path d="M65 402l3-1
                       m14 5 3-1
                       m9-8 3-1"/>

              <!-- Strawberry parfait -->
              <path d="M548 143h54l-8 36
                       q-4 15-19 15t-19-15z
                       M575 194v19
                       m-15 2h30
                       M553 163q12-8 22 0t22 0"/>

              <path d="M548 143q-2-12 12-16
                       -2-11 13-12
                       0-10 10-12
                       -2 10 8 15
                       12 5 11 25
                       M588 116l10-25"/>

              <!-- Bath bubbles -->
              <circle cx="106" cy="83" r="9"/>
              <circle cx="127" cy="65" r="4"/>
              <circle cx="515" cy="373" r="12"/>
              <circle cx="538" cy="354" r="6"/>
              <circle cx="531" cy="398" r="4"/>

              <!-- Tile decoration -->
              <path d="M559 440h64
                       m-64 15h64
                       m-50-29v43
                       m19-43v43
                       m19-43v43"
                    opacity=".55"/>
            </g>
          </svg>

          <!-- Portrait illustration -->
          <svg class="portrait"
               viewBox="0 0 335 460"
               fill="none"
               aria-hidden="true">

            <path d="M278 57
              C232 83 202 129 151 151
              C115 167 85 165 67 143
              C57 131 53 117 51 107
              C84 120 105 143 110 169
              C116 196 103 221 94 239
              C89 250 101 253 113 252
              C125 251 127 260 127 270
              C127 279 135 282 143 278
              C152 273 163 273 172 275
              C163 274 151 276 148 282
              C145 289 151 295 158 294
              C163 294 167 290 171 291
              C182 295 180 310 182 323
              C184 335 196 338 210 331
              C243 315 263 278 274 245
              C281 225 274 207 262 207
              C247 207 239 228 245 247
              C252 275 278 295 288 321
              C307 370 255 379 203 387
              C157 395 128 402 122 429
              C118 440 118 450 119 458"
              stroke="currentColor"
              stroke-width="1.65"
              stroke-linecap="round"
              stroke-linejoin="round"/>
          </svg>

          <div class="product-light" aria-hidden="true"></div>

          <!-- Interactive beauty device -->
          <div class="device">
            <div class="device-head" aria-hidden="true">
              <div class="window"></div>
            </div>

            <div class="meter" aria-hidden="true">
              <i></i>
              <i></i>
            </div>

            <button
              id="power"
              type="button"
              aria-label="電源ボタン。１回押すと弱、弱のときに素早く２回押すと強、長押しで電源オフ。">
              ⏻
            </button>

            <span class="power-caption" aria-hidden="true">
              ここを押して
            </span>

            <small>つるるん</small>
          </div>

          <div class="vertical-note">
            お風呂あがりの美容時間
          </div>

          <div class="editors-note">
            <strong>編集部メモ</strong>
            冬色のページを着替えてみて。

            <button id="direct" type="button">
              <span id="direct-label">電源を入れる（弱）</span>
              <span aria-hidden="true">↗</span>
            </button>
          </div>

          <div class="cover-seal">
            創刊25周年
            <br>
            特別記念号
          </div>

          <figcaption>
            図１ ／ 冬のおうち美容
          </figcaption>
        </figure>
      </div>

      <footer>
        <span>色でわかる、光美容器のモード切り替え</span>
        <span class="page-number" aria-label="25ページ">25</span>
      </footer>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
